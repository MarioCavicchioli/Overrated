name: Playbook Keeper

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playbook-keeper
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r agents/caseworker/requirements.txt
      - run: python -m agents.playbook.playbook_keeper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYBOOK_KEEPER_AGENT_ID: ${{ secrets.PLAYBOOK_KEEPER_AGENT_ID }}
          MANAGED_AGENT_ENVIRONMENT_ID: ${{ secrets.MANAGED_AGENT_ENVIRONMENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
