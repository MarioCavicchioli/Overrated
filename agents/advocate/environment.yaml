# Sandbox for advocate sessions, one session per pack. It is separate from the
# Scout's environment (where the builders run), so an advocate session can never
# see builder notes. The advocate has no sandbox tools (all its tools are custom
# tools answered by the orchestrator), so it needs no network access at all.
name: overrated-advocate
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: false
    allow_mcp_servers: false
